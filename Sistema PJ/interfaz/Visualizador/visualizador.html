<html lang="en">

    <!-- Script para usar libreria para alertas -->

	<script src="sweetalert2.all.min.js"></script>

</head>
<body>
  <section class="h-screen flex overflow-hidden">

    <div class="bg-white w-3/12 p-6 flex flex-col h-full">
        <!-- Navegación de Pestañas -->

            <li class="nav-item" role="presentation">

            </li>

        <!-- Contenedor de Contenidos -->

            <!-- PESTAÑA 1: Chat -->

                <label class="form-label text-sm font-weight-bold">Aplicación</label>
                <select id="app" name="app" class="form-select form-select-lg mb-3" style="font-size: 1.1rem; padding: 10px;">
                    <option value="whatsapp">whatsapp</option>
                </select>

                <textarea id="contenido" cols="30" rows="4" class="styleTextArea margenDeArriba margenDeAbajo form-control rounded-0 text-sm w-100" readonly="readonly"></textarea>

                <label class="m-1 h5 text-sm"> Filtrar por Fecha</label>
                <input type="text" name="Fecha" id="Fecha" class="margenDeAbajo form-control" value="">

                <div id="scrollFechas" class="scroll-container margenDeAbajo">
                    <div class="item" style="color: #888; font-size: 0.85rem;">No hay fechas seleccionadas</div>
                </div>

                <button id="deleteBtn" type="button" class="m-1 btn btn-outline-danger btn-sm text-sm margenDeAbajo">Eliminar</button>
                <br><br>

                <div class="centrar">
                    <button type="button" onclick="recargarMensajes()" class="btn btn-outline-primary text-sm" id="mostrar">Recargar chat</button>
                    <br><br>
                    <div class="centrar">
                        <button type="button" onclick="exportarChat()" class="btn btn-outline-primary text-sm" id="idExportar">Exportar Chat</button>
                    </div>
                </div>
            </div>

            <!-- PESTAÑA 2: Participantes -->
            <div class="tab-pane fade" id="content-participantes" role="tabpanel" aria-labelledby="tab-participantes">
                <h3 class="centrar text-xl mb-2 m-1"> Participantes </h3>
                <br>
                <label class="m-1 h5 text-sm"> Seleccione el actor titular de la cuenta</label>
                <br>

                <select id="Nombres_Personas" class="margenDeAbajo m-1 form-select form-select-sm" aria-label=".form-select-sm example">
                    <!-- Aca insertaria las personas en forma dinamica -->
                </select>

                <label class="m-1 h5 text-sm"> Ingrese más información de los participantes</label>
                <br>
                <div class="input-group mb-3">
                    <span class="input-group-text text-sm" id="basic-addon1">Text</span>
                    <input id="InputTexto" type="text" class="m-1 form-control text-sm" placeholder="Escriba aquí" aria-label="Username" aria-describedby="basic-addon1">
                </div>

                <textarea id="contenidoTextArea" cols="30" rows="2" class="styleTextArea margenDeAbajo form-control rounded-0 text-sm" readonly="readonly"></textarea>

                <button id="BtnAgregar" type="button" class="m-1 btn btn-outline-primary btn-sm text-sm">Agregar</button>
                <br>


                <hr class="my-3">


            </div>

            <!-- PESTAÑA 3: Informe -->
            <div class="tab-pane fade" id="content-informe" role="tabpanel" aria-labelledby="tab-informe">
                <h3 class="centrar text-xl mb-2 m-1"> Informe </h3>
                <br>
                <form id="formReporte">
                    <h4 id="etq" class="mb-3 text-center font-weight-bold">Generación de Reporte</h4>

                    <div class="mb-3">
                        <div class="row">
                            <div class="col-md-6 mb-2 mb-md-0">
                                <label for="inputPEX" class="form-label font-weight-bold">Numero de causa:</label>
                                <input type="text" id="inputPEX" class="form-control form-control-sm" placeholder="Numero de causa" required>
                            </div>
                            <div class="col-md-6 mb-2 mb-md-0">
                                <label for="inputFechaReporte" class="form-label font-weight-bold">Fecha del aporte:</label>
                                <input type="date" id="inputFechaReporte" class="form-control form-control-sm" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="row">
                            <label class="form-label font-weight-bold">Perito:</label>
                            <div class="col-md-6 mb-2 mb-md-0">
                                <label for="inputNombrePerito" class="form-label font-weight-bold">Nombre:</label>
                                <input type="text" id="inputNombrePerito" class="form-control form-control-sm" placeholder="Nombre del perito">
                                <br>
                                <label for="inputDependenciaPerito" class="form-label font-weight-bold">Dependencia:</label>
                                <input type="text" id="inputDependenciaPerito" class="form-control form-control-sm" placeholder="Dependencia del perito">
                            </div>
                            <div class="col-md-6 mb-2 mb-md-0">
                                <label for="inputApellidoPerito" class="form-label font-weight-bold">Apellido:</label>
                                <input type="text" id="inputApellidoPerito" class="form-control form-control-sm" placeholder="Apellido del perito">
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="row">
                            <label class="form-label font-weight-bold">Aportante:</label>
                            <div class="col-md-6 mb-2 mb-md-0">
                                <label for="inputNombreAportante" class="form-label font-weight-bold">Nombre:</label>
                                <input type="text" id="inputNombreAportante" class="form-control form-control-sm" placeholder="Nombre del aportante">
                                <br>
                                <label for="inputDNIAportante" class="form-label font-weight-bold">DNI:</label>
                                <input type="text" id="inputDNIAportante" class="form-control form-control-sm" placeholder="DNI del aportante">
                            </div>
                            <div class="col-md-6 mb-2 mb-md-0">
                                <label for="inputApellidoAportante" class="form-label font-weight-bold">Apellido:</label>
                                <input type="text" id="inputApellidoAportante" class="form-control form-control-sm" placeholder="Apellido del aportante">
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="row">
                            <label class="form-label font-weight-bold">Dispositivo:</label>
                            <div class="col-md-6 mb-2 mb-md-0">
                                <label for="inputMarcaDispositivo" class="form-label font-weight-bold">Marca:</label>
                                <input type="text" id="inputMarcaDispositivo" class="form-control form-control-sm" placeholder="Marca del dispositivo">
                                <br>
                                <label for="inputImeiDispositivo" class="form-label font-weight-bold">Imei:</label>
                                <input type="text" id="inputImeiDispositivo" class="form-control form-control-sm" placeholder="Imei">
                            </div>
                            <div class="col-md-6">
                                <label for="inputModeloDispositivo" class="form-label font-weight-bold">Modelo:</label>
                                <input type="text" id="inputModeloDispositivo" class="form-control form-control-sm" placeholder="Modelo del dispositivo">
                            </div>
                        </div>
                    </div>
                              <hr class="my-3">

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Participantes:</label>
                    <div id="scrollParticipantes" class="scroll-container margenDeAbajo">
                        <div class="item text-muted" style="font-size: 0.85rem;">No hay participantes</div>
                    </div>
                </div>
                        <div class="col-md-6">
                        <label class="form-label font-weight-bold">Capturas participantes</label>
                        <div id="scrollCapturasParticipantes" class="scroll-container margenDeAbajo">
                            <div class="item text-muted" style="font-size: 0.85rem;">No hay capturas</div>
                        </div>
                        <div class="d-flex gap-2 mt-2">
                            <button id="agregarCapturaBtn" type="button" class="btn btn-outline-success btn-sm text-sm">Agregar</button>
                            <button id="eliminarCapturaBtn" type="button" class="btn btn-outline-danger btn-sm text-sm">Eliminar</button>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Capturas chat</label>
                        <div id="scrollCapturasChat" class="scroll-container margenDeAbajo">
                            <div class="item text-muted" style="font-size: 0.85rem;">No hay capturas</div>
                        </div>
                        <div class="d-flex gap-2 mt-2">
                            <button id="agregarCapturaChatBtn" type="button" class="btn btn-outline-success btn-sm text-sm">Agregar</button>
                            <button id="eliminarCapturaChatBtn" type="button" class="btn btn-outline-danger btn-sm text-sm">Eliminar</button>
                        </div>
                    </div>
                           <hr class="my-3">

                    <div class="mb-4">
                        <label class="form-label font-weight-bold">Multimedias: </label>
                        <div id="scrollMultimedia" class="scroll-container margenDeAbajo">
                            <div class="item text-muted" style="font-size: 0.85rem;">No hay elementos</div>
                        </div>
                        <input type="text" id="inputDescripcionMultimedia" class="form-control form-control-sm mt-2" placeholder="Descripcion">
                        <br>
                        <button id="agregarMultimediaBtn" type="button" class="btn btn-outline-success btn-sm text-sm">Agregar multimedia</button>
                        <button id="eliminarMultimediaBtn" type="button" class="btn btn-outline-danger btn-sm text-sm">Eliminar multimedia</button>
                    </div>
                    <div class="text-end mb-2">
                        <button id="generarReporteBtn" onclick="generarReporte(event)" class="btn btn-success btn-sm text-sm">Generar reporte</button>
                    </div>
                </form>
            </div>

        </div>

    </div>
            <div class="cuerpo w-9/12">
            <!-- Header -->
            <div class="gradiente px-20 py-6 border-b">
                <p id="ParrafoWhatsApp"> Conversación </p>
            </div>

            <!-- Chat propiamente dicho -->
            <div class="cuerpo px-20 py-6 overflow-auto h-5/6" id="idContenido">
                <!-- Carga de mensajes en forma dinamica -->
            </div>
</section>
    <script type="text/javascript">
        window.fechas = [];
        let  selectedIndex = null;

    function renderList(scrollV, lista, currentIndex, onItemClick) {
    const scroll = document.getElementById(scrollV);
    scroll.innerHTML = '';

    if (!lista || lista.length === 0) {
        scroll.innerHTML = '<div class="item text-muted" style="font-size: 0.85rem;">No hay elementos</div>';
        return;
    }

    lista.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item';
        const displayText = (typeof item === 'object' && item !== null) ? item.display : item;
        div.textContent = `${index + 1}. ${displayText}`;
        div.style.cursor = 'pointer';

        if (index === currentIndex) {
            div.style.backgroundColor = '#e2e8f0';
            div.style.fontWeight = 'bold';
        }

        div.addEventListener('click', () => {
            // Ejecuta la función asociada al hacer clic si existe
            if (typeof onItemClick === 'function') {
                onItemClick(item, index);
            }
            // Vuelve a renderizar la lista para actualizar los estilos visuales
            renderList(scrollV, lista, index, onItemClick);
        });

        scroll.appendChild(div);
    });
}

        $(function() {
            $('input[name="Fecha"]').daterangepicker({
                autoUpdateInput: false,
                locale: {
                format: 'D/M/YY',
                "separator": " - ",
                "applyLabel": "Agregar",
                "cancelLabel": "Cancelar",
                "fromLabel": "From",
                "toLabel": "To",
                "customRangeLabel": "Custom",
                "daysOfWeek": [
                    "do",
                    "Lu",
                    "Ma",
                    "Mi",
                    "Ju",
                    "Vi",
                    "Sá"
                ],
                "monthNames": [
                    "Enero",
                    "Febrero",
                    "Marzo",
                    "Abril",
                    "Mayo",
                    "Junio",
                    "Julio",
                    "Agosto",
                    "Septiembre",
                    "Octubre",
                    "Noviembre",
                    "Diciembre"
                ],
              }
            });
          });

$('input[name="Fecha"]').on('apply.daterangepicker', function(ev, picker) {
    let formattedRange = picker.startDate.format('D/M/YY') + ' - ' + picker.endDate.format('D/M/YY');

    $(this).val(formattedRange);

    if (!window.fechas) {
        window.fechas = [];
    }

    window.fechas.push({
        start: picker.startDate.format('D/M/YY'),
        end: picker.endDate.format('D/M/YY'),
        display: formattedRange
    });
    selectedIndex = window.fechas.length - 1;
    renderList("scrollFechas",window.fechas,selectedIndex);
    }
);

$('input[name="Fecha"]').on('cancel.daterangepicker', function(ev, picker) {
    console.log($(this));
});


document.getElementById('deleteBtn').addEventListener('click', () => {
    if (window.fechas && window.fechas.length > 0) {
        let indexToRemove = (selectedIndex !== null && selectedIndex < window.fechas.length) ? selectedIndex : window.fechas.length - 1;
        window.fechas.splice(indexToRemove, 1);
        selectedIndex = null;
    renderList("scrollFechas",window.fechas,selectedIndex);
    }
});

</script>

    <script src="/visualizador/visualizador.js" type="text/javascript"></script>

</body>
</html>
